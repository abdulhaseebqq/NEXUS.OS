name: NEXUS OS Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nexus_os"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_os
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_os
      APP_NAME: NEXUS OS
      VERSION: 0.1.0
      AUTHOR: Haseeb
      DEBUG: "True"
      JWT_SECRET_KEY: nexus_os_super_secret_key_2026
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AI_ENGINE: Not Initialized
      DATABASE_NAME: nexus_os

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Formatting
        run: python -m black --check src tests

      - name: Check Imports
        run: python -m isort --profile black --check-only src tests

      - name: Lint
        run: python -m flake8 src tests

      - name: Type Check
        run: python -m mypy src

      - name: Run Tests
        run: pytest -v

      - name: Build Docker Image
        run: docker build -t nexus-os-backend .