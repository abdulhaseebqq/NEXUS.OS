services:
  postgres:
    image: postgres:17
    container_name: nexus_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "11224433"
      POSTGRES_DB: nexus_os

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d nexus_os",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexus_backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:11224433@postgres:5432/nexus_os

    ports:
      - "8000:8000"

    volumes:
      - ./uploads:/app/uploads

    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade head && uvicorn src.backend.server:app --host 0.0.0.0 --port 8000",
      ]

volumes:
  postgres_data: