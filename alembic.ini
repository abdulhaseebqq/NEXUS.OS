# NEXUS OS Alembic configuration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

# Actual database URL migrations/env.py me .env se load hogi.
sqlalchemy.url = postgresql://placeholder:placeholder@localhost/placeholder


[post_write_hooks]
# Migration files ko generate karne ke baad manually Black/isort se
# format kiya jayega.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S